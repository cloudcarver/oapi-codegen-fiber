openapi: "3.0.0"

info:
  version: 1.0.0
  title: Test
  description: |
    This is a test API.

servers:
- url: /api/v1

paths:
  /sign-in:
    post:
      operationId: signIn
      responses:
        '200':
          description: OK
      security: []

  /test0:
    get:
      operationId: test0
      responses:
        '200':
          description: OK
      security:
        - BearerAuth: []
    post:
      operationId: test0Post
      responses:
        '200':
          description: OK
      security:
        - BearerAuth: []
        - API: []

  /test2:
    get:
      responses:
        '200':
          description: OK
      security:
        - BearerAuth: []

  /test3:
    get:
      responses:
        '200':
          description: OK
      security:
        - BearerAuth: []

  /user/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - BearerAuth:
            - x.CheckOperationID(c, operationID)

  /clusters/{clusterId}:
    get:
      responses:
        '200':
          description: OK
      operationId: getUser
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      security:
        - BearerAuth:
            - x.CheckOperationID(c, operationID)
            - x.OwnCluster(c, x.GetUserID(c), clusterId)

x-check-rules:
  OwnCluster:
    description: Check if the user is in the cluster
    useContext: true
    parameters:
      - name: userId
        description: The user ID
        schema:
          type: integer
          format: int32
      - name: clusterId
        description: The cluster ID
        schema:
          type: integer
          format: int32
  CheckOperationID:
    description: Check if the operation ID is in the security definitions
    useContext: true
    parameters:
      - name: operationID
        description: The operation ID
        schema:
          type: string

x-functions:
  GetUserID:
    description: Get the user ID from the request
    useContext: true
    return:
      schema:
        type: integer
        format: int32
      description: The user ID
